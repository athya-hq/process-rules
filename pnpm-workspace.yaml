# A package version must be a day old before it installs: a hijacked release is
# usually caught and pulled within hours.
minimumReleaseAge: 1440
# niyam's own packages are standing exceptions (Alok, 2026-11-14): nobody else
# watches these releases, so the day buys nothing, and it holds back every
# guard fix. What checks them instead is `pnpm provenance`
# (scripts/own-provenance.mjs, the first step of `pnpm check`): veda's release
# workflow built each one from its tag.
minimumReleaseAgeExclude: ['@veda-hq/*']
