name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  secrets:
    name: Secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Both scanners are pinned by version and by the sha256 their release
      # checksums publish. Gitleaks matches patterns; TruffleHog also verifies
      # what it finds against the issuing service.
      - name: Gitleaks and TruffleHog over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TRUFFLEHOG_VERSION: 3.99.7
          TRUFFLEHOG_SHA256: bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/scanners"
          mkdir -p "$DIR"
          GL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          TH="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$DIR/$GL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GL}"
          curl -fsSL --retry 3 -o "$DIR/$TH" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${TH}"
          echo "${GITLEAKS_SHA256}  $DIR/$GL" | sha256sum -c -
          echo "${TRUFFLEHOG_SHA256}  $DIR/$TH" | sha256sum -c -
          tar -xzf "$DIR/$GL" -C "$DIR" gitleaks
          tar -xzf "$DIR/$TH" -C "$DIR" trufflehog
          "$DIR/gitleaks" git --no-banner --redact --config=.gitleaks.toml .
          "$DIR/trufflehog" git "file://$PWD" --no-update --fail --results=verified,unknown
