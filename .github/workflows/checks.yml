name: process-rules checks

# The shared workflow every client calls from the workflow `onboard` writes.
# Later slices add their checks here as jobs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check .github/process-rules.json
        run: |
          set -euo pipefail
          file=.github/process-rules.json
          fail() { echo "::error file=$file::$1"; exit 1; }
          [ -f "$file" ] || fail "$file is missing; run process-rules onboard"
          jq -e 'type == "object"' "$file" >/dev/null || fail "$file is not a JSON object"
          owner=$(jq -r 'if (.owner | type) == "string" then .owner else "" end' "$file")
          agent=$(jq -r 'if (.agent | type) == "string" then .agent else "" end' "$file")
          login='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          [[ $owner =~ $login ]] || fail '"owner" must be a GitHub login'
          [[ $agent =~ $login ]] || fail '"agent" must be a GitHub login'
          lower() { printf %s "$1" | tr '[:upper:]' '[:lower:]'; }
          [ "$(lower "$owner")" != "$(lower "$agent")" ] || fail "owner and agent must be different accounts"
          echo "process-rules: owner $owner approves; agent $agent builds."
