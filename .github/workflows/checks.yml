name: niyam checks

# The shared workflow every client calls from the workflow `onboard` writes.
# Later slices add their checks here as jobs.
# Each job runs the CLI from this workflow's own commit, job.workflow_sha, so
# the checks and the CLI are always one release. Settings fails a caller whose
# niyam-ref names another release: Dependabot and Renovate move a job's
# `uses:` line alone. GitHub Enterprise Server has no job.workflow_*, so there
# the CLI comes from niyam-ref, as before.
# A caller onboarded before P-56 passes process-rules-ref instead, so both are
# declared (an undeclared input makes the caller invalid, and none of its
# checks run), and each job takes niyam-ref, else process-rules-ref, else main.
on:
  workflow_call:
    inputs:
      niyam-ref:
        description: The niyam release the caller pins, which must be the one its uses line names
        type: string
        default: ''
      process-rules-ref:
        description: niyam-ref's name before P-56, for a caller onboard has not moved yet
        type: string
        default: ''
    secrets:
      FIGMA_TOKEN:
        description: A Figma token that reads the design library and the frames states link
        required: false
      FIGMA_LIBRARY:
        description: The file key of the Figma design library, kept out of the committed settings
        required: false

# No workflow-wide permissions: GitHub refuses a whole run, before any job's
# `if`, when a job here asks for more than the calling job grants. So the
# read-only jobs say so each, and the weekly job takes what its caller grants:
# `issues: write` from the client's weekly job, nothing more from the others.
# The merged job does too: `issues: write` from the client's merged job.
jobs:
  settings:
    name: Settings
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check .github/niyam.json
        run: |
          set -euo pipefail
          # Repos onboarded before niyam keep .github/process-rules.json, still read when the new name is missing.
          file=.github/niyam.json
          [ -f "$file" ] || [ ! -f .github/process-rules.json ] || file=.github/process-rules.json
          fail() { echo "::error file=$file::$1"; exit 1; }
          [ -f "$file" ] || fail "$file is missing; run niyam onboard"
          jq -e 'type == "object"' "$file" >/dev/null || fail "$file is not a JSON object"
          owner=$(jq -r 'if (.owner | type) == "string" then .owner else "" end' "$file")
          agent=$(jq -r 'if (.agent | type) == "string" then .agent else "" end' "$file")
          login='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          [[ $owner =~ $login ]] || fail '"owner" must be a GitHub login'
          [[ $agent =~ $login ]] || fail '"agent" must be a GitHub login'
          lower() { printf %s "$1" | tr '[:upper:]' '[:lower:]'; }
          [ "$(lower "$owner")" != "$(lower "$agent")" ] || fail "owner and agent must be different accounts"
          echo "niyam: owner $owner approves; agent $agent builds."
      # This workflow's own package.json: the release whose CLI every job here runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check niyam-ref names the release that runs
        env:
          REF: ${{ inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          # The input the caller set, which the messages name.
          INPUT: ${{ inputs.niyam-ref == '' && inputs.process-rules-ref != '' && 'process-rules-ref' || 'niyam-ref' }}
          CALLER: ${{ github.workflow_ref }}
          OWN_SHA: ${{ job.workflow_sha }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Without job.workflow_sha the CLI came from the ref itself, so the two always agree here.
          if [ -z "$OWN_SHA" ] && [ "$SERVER" = https://github.com ]; then
            echo "::warning::GitHub gave no job.workflow_sha, so the checks run the CLI at $INPUT $REF, which may not be their own release."
          fi
          # The caller's workflow file: owner/repo/<path>@<ref>.
          file=${CALLER#*/*/}
          file=${file%%@*}
          version=$(jq -r .version .niyam/package.json)
          sha=$(git -C .niyam rev-parse HEAD)
          # A release tag is vX.Y.Z and a commit its full sha, as uses: lines take them; anything else is a branch.
          if [[ $REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [ "${REF#v}" = "$version" ] && same=1 || same=
          elif [[ $REF =~ ^[0-9a-f]{40}$ ]]; then
            [ "$REF" = "$sha" ] && same=1 || same=
          else
            echo "niyam: $INPUT is the branch $REF; these checks run v$version ($sha)."
            exit 0
          fi
          if [ -z "$same" ]; then
            echo "::error file=$file::$INPUT is $REF, but this workflow runs the shared checks at v$version. Dependabot and Renovate move only a job's uses: line. Run niyam onboard with v$version, which moves every pin, or set $INPUT: v$version on every job."
            exit 1
          fi
          echo "niyam: $INPUT $REF is the release that runs, v$version ($sha)."

  identity:
    name: PR identity
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The settings come from the base branch: a pull request cannot rename the agent it is checked against.
      # A base with none passes, saying the repo is not adopted there yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Agent commits must be Verified as the agent and pushed by it.
      - run: node .niyam/src/cli.ts pr-identity
        env:
          GH_TOKEN: ${{ github.token }}

  work-rules:
    name: Work rules
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The settings come from the base branch, as in PR identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # An agent pull request builds exactly one slice that may be built.
      - run: node .niyam/src/cli.ts pr-work-rules
        env:
          GH_TOKEN: ${{ github.token }}

  design:
    name: Design frames
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The settings come from the base branch, as in PR identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Off unless figma is on and FIGMA_LIBRARY and FIGMA_TOKEN are set.
      - run: node .niyam/src/cli.ts pr-design
        env:
          GH_TOKEN: ${{ github.token }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_LIBRARY: ${{ secrets.FIGMA_LIBRARY }}

  merged:
    name: Slice done
    # Into the default branch alone, and from this repository: a fork's run gets a read-only token.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The caller's permissions: the client's merged job grants issues: write.
    steps:
      # The settings come from the branch the pull request merged into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The slice the pull request names is closed, which moves it to Done on the board, and so is each State of it the pull request names.
      - run: node .niyam/src/cli.ts pr-merged
        env:
          GH_TOKEN: ${{ github.token }}

  decisions:
    name: Decisions, weekly
    # Not on the hourly needs-owner sweep's cron, which the client's niyam-asks job calls these checks on.
    if: (github.event_name == 'schedule' && github.event.schedule != '41 * * * *') || github.event_name == 'workflow_dispatch'
    # One run at a time, so two cannot both open an undo issue for one decision. The key keeps its name from
    # before niyam: a repo's runs at an older release use it too, and only one key serializes them all. P-57
    # renames it once no repo pins a release before the one P-56 shipped in.
    concurrency:
      group: process-rules-decisions-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Checks stop starting after 45 minutes; the rest wait for next week.
    timeout-minutes: 60
    # The caller's permissions: the client's weekly job grants issues: write.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Each open Decision issue's check; undo issues and labels on GitHub.
      - run: node .niyam/src/cli.ts decisions-weekly
        env:
          GH_TOKEN: ${{ github.token }}

  needs-owner:
    name: Needs you
    # An agent's ask labels its issue needs-owner; the owner's approved label or Decision: comment takes it off at once,
    # and the hourly sweep, or a run by hand, takes it off where the owner 👍'd the latest ask.
    if: >-
      github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled') ||
      (github.event_name == 'schedule' && github.event.schedule == '41 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The caller's permissions: the client's niyam-asks job grants issues and pull-requests write, its weekly job issues write.
    steps:
      # The settings come from the default branch: a comment cannot rename the owner it is judged against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .niyam/src/cli.ts needs-owner
        env:
          GH_TOKEN: ${{ github.token }}

  issue-type:
    name: Issue type
    # An issue opened or reopened with no type gets the work model's. Issue events never come from a fork.
    # GitHub starts no run for an issue a workflow's own token opens, so the hourly sweep types those.
    if: >-
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
      (github.event_name == 'schedule' && github.event.schedule == '41 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The caller's permissions: the client's niyam-asks job grants issues: write, which sets an issue's type,
    # on these events and the hourly cron alike.
    steps:
      # The settings come from the default branch: an issue cannot rename the Approvals issue it is judged against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'veda-hq/niyam' }}
          ref: ${{ job.workflow_sha || inputs.niyam-ref || inputs.process-rules-ref || 'main' }}
          path: .niyam
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .niyam/src/cli.ts issue-type
        env:
          GH_TOKEN: ${{ github.token }}
