# Written by process-rules onboard: the shared process-rules checks at v0.6.4.
# To upgrade, change the version on every line that names it (two per job).
# The weekly, merged and needs-owner jobs are split out so pull request and push runs stay read-only.
name: process-rules

on:
  pull_request:
    # edited: a changed "Slice: #N" line is checked again; closed: a merged pull request closes its slice.
    types: [opened, synchronize, reopened, edited, closed]
  push:
    branches: ["main"]
  # A comment that asks the owner labels its issue needs-owner; the owner's approved label or Decision: comment takes it off.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # opened, reopened: an issue with no type gets the work model's.
  issues:
    types: [labeled, opened, reopened]
  # The weekly decisions job: Mondays, 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
    # Hourly: the owner's 👍 on an ask takes its needs-owner label off.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Pull request and push runs: read-only.
  process-rules:
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'push'
    uses: veda-hq/niyam/.github/workflows/checks.yml@v0.6.4
    with:
      process-rules-ref: v0.6.4

  # The weekly run alone writes to issues: it comments and opens undo issues.
  process-rules-weekly:
    if: (github.event_name == 'schedule' && github.event.schedule != '41 * * * *') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: veda-hq/niyam/.github/workflows/checks.yml@v0.6.4
    with:
      process-rules-ref: v0.6.4

  # A merged pull request closes the slice it names, which moves it to Done on the board.
  process-rules-merged:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: veda-hq/niyam/.github/workflows/checks.yml@v0.6.4
    with:
      process-rules-ref: v0.6.4

  # An ask labels its issue needs-owner, which the board's Needs you view lists; the owner's answer takes it off.
  # An issue opened or reopened with no type gets the work model's.
  process-rules-asks:
    if: >-
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, 'Needs you:') || contains(github.event.comment.body, 'Proposal:') ||
      contains(github.event.comment.body, 'Decision:'))) ||
      (github.event_name == 'issues' && github.event.label.name == 'approved') ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
      (github.event_name == 'schedule' && github.event.schedule == '41 * * * *')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: veda-hq/niyam/.github/workflows/checks.yml@v0.6.4
    with:
      process-rules-ref: v0.6.4
