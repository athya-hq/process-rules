# Temporary: proves the split workflow against checks.yml at this branch; reverted before merge.
# To upgrade, change the version on every line that names it (two per job).
# The weekly job is split out so pull request and push runs stay read-only.
name: process-rules

on:
  pull_request:
    # edited: a changed "Slice: #N" line is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]
  # The weekly decisions job: Mondays, 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Pull request and push runs: read-only.
  process-rules:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: athya-hq/process-rules/.github/workflows/checks.yml@db1706a6fcbc300384713fe4eade08235b7c1320
    with:
      process-rules-ref: db1706a6fcbc300384713fe4eade08235b7c1320
    secrets:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

  # The weekly run alone writes to issues: it comments and opens undo issues.
  process-rules-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: athya-hq/process-rules/.github/workflows/checks.yml@db1706a6fcbc300384713fe4eade08235b7c1320
    with:
      process-rules-ref: db1706a6fcbc300384713fe4eade08235b7c1320
    secrets:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
