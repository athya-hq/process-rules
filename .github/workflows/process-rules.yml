# Written by process-rules onboard: the shared process-rules checks at v0.5.19.
# To upgrade, change the version on every line that names it (two per job).
# The weekly and merged jobs are split out so pull request and push runs stay read-only.
name: process-rules

on:
  pull_request:
    # edited: a changed "Slice: #N" line is checked again; closed: a merged pull request closes its slice.
    types: [opened, synchronize, reopened, edited, closed]
  push:
    branches: ["main"]
  # The weekly decisions job: Mondays, 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Pull request and push runs: read-only.
  process-rules:
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'push'
    uses: athya-hq/process-rules/.github/workflows/checks.yml@v0.5.19
    with:
      process-rules-ref: v0.5.19

  # The weekly run alone writes to issues: it comments and opens undo issues.
  process-rules-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: athya-hq/process-rules/.github/workflows/checks.yml@v0.5.19
    with:
      process-rules-ref: v0.5.19

  # A merged pull request closes the slice it names, which moves it to Done on the board.
  process-rules-merged:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: athya-hq/process-rules/.github/workflows/checks.yml@v0.5.19
    with:
      process-rules-ref: v0.5.19
