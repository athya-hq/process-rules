name: Release

# A tag vX.Y.Z on main makes the release clients pin: their workflow calls
# checks.yml at the tag, and machines install the CLI package attached to it,
# built and tested here, so nothing is built on install.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names package.json's version and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # pnpm check builds dist/ and tests it; the package attached below is that build.
      - run: pnpm check
      - name: Pack the CLI
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      # The same build under the old name, for one release at least: 0.6.x's
      # upgrade installs athya-hq-process-rules-<version>.tgz, and pnpm refuses a
      # second global package with the bin process-rules. This one replaces the
      # old package in place; niyam upgrade then moves it to @veda-hq/niyam.
      - name: Pack the bridge, the same CLI under its old name
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json"
          jq '.name = "@athya-hq/process-rules"' "$RUNNER_TEMP/package.json" > package.json
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package.json" package.json
      - name: Publish the release, with the CLI package and the bridge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/veda-hq-niyam-*.tgz "$RUNNER_TEMP"/athya-hq-process-rules-*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "niyam $TAG"
