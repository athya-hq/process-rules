# Weekly updates for the npm dev dependencies and the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependabot waits 3 days after a release by default. Our own checks
    # workflow is proposed at its newest release; other actions keep the wait.
    cooldown:
      default-days: 3
      exclude: ['athya-hq/process-rules*']
    groups:
      actions:
        patterns: ['*']
